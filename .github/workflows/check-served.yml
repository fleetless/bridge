# What a served apt repository actually offers, asked by installing from it in
# a clean container per distribution (apt/check-served.sh). The apt publishing
# workflow runs the same script after every publish; this is the same question
# by hand -- after a re-sign, or whenever the answer is in doubt.
name: check-served

on:
  workflow_dispatch:
    inputs:
      version:
        description: the upstream version every named suite must serve, e.g. 3.1.0
        required: true
        type: string
      distros:
        description: space-separated distributions (empty = every one in tools/distros.sh)
        default: ""
        type: string
      base_url:
        description: the served repository
        default: https://apt.fleetless.dev
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          BASE_URL: ${{ inputs.base_url }}
          VERSION: ${{ inputs.version }}
          DISTROS: ${{ inputs.distros }}
        # $DISTROS unquoted on purpose: it is a word list, and an empty one
        # must pass no argument at all.
        run: ./apt/check-served.sh "$BASE_URL" "$VERSION" $DISTROS
