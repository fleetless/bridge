# Release: this repository's `main`, as the next version, published to apt
# (the per-repository release design of 2026-09-23, in fleetless/fleetless).
#
# Press "Run workflow" on main. The version comes from the Conventional
# Commits since the last tag (.github/release/release.mjs). A release PR
# writes it into the three places that must agree — __version__,
# package.xml, and a new top entry in debian/changelog.in listing the commit
# subjects (bridge-version.mjs) — and merges itself once the required
# `verify` check, the suite on every distribution, passes. The merge commit
# is tagged and packaged once. ci/package.sh already installs every package
# in its own distribution's container, and proves the other suites refuse it
# (apt/verify-suites.sh), so the build is checked before anything is
# published. The packages and SHA256SUMS become the GitHub release, uploaded
# with this workflow's GITHUB_TOKEN, because the ops repository refuses any
# other uploader. Then the ops repository is asked to publish them to apt.
#
# That publish is no longer a separate decision. A robot takes a new version
# within minutes, and reprepro refuses a second build of a version, so the
# check that used to be a person looking at the release is now the install
# check above. publish-apt.yml installs from the served suite afterwards, as
# before.
#
# A run that failed can be started again: an open release PR is reused and
# rebuilt on the current `main`, a merged release commit is tagged, a tag
# already on HEAD continues that release, and a release with only some of its
# packages is completed --
# safe because fetch-bridge-release.sh on the ops side wants exactly three
# `.deb` files plus SHA256SUMS, so a release short a package was never
# published to apt in the meantime, only sitting on GitHub incomplete.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto, from the commits; an override only raises it
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: main, and nothing but main
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release runs on main, not $GITHUB_REF" >&2; exit 1; }
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "main moved after this run started; run it again" >&2; exit 1; }
      - name: the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          tag="$(node .github/release/release.mjs tag-at-head)"
          if [ -n "$tag" ]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already carries $tag: continuing that release"
          else
            # Assign, then echo: under `set -e`, a command substitution that
            # fails inside `echo` leaves echo's own exit status, which is 0.
            version="$(node .github/release/release.mjs next --bump "$BUMP")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  release-commit:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAGGED: ${{ needs.prepare.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A persisted credential would push the branch as
          # github-actions[bot], and no check would ever run on the PR.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.FLEETLESS_APP_ID }}
          private-key: ${{ secrets.FLEETLESS_APP_PRIVATE_KEY }}
          owner: fleetless
          repositories: bridge
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
      - name: the release commit, through a pull request
        id: commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$TAGGED" = true ]; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merged="$(node .github/release/release.mjs release-commit --version "$VERSION")"
          if [ -n "$merged" ]; then
            echo "commit=$merged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch="release/$VERSION"
          # Past the two early exits the branch is rebuilt every time on this
          # job's HEAD, which is current main. A failed run leaves a release PR
          # that main soon moves past, or one carrying a red check, and
          # merge-pr refuses both for ever -- reusing such a PR untouched makes
          # every later run fail the same way. The force-push puts it back on
          # today's main and restarts its required check.
          git switch -q -c "$branch"
          node .github/release/bridge-version.mjs write --version "$VERSION"
          git -c user.name="fleetless-release[bot]" -c user.email="fleetless-release[bot]@users.noreply.github.com" \
            commit -q -am "chore(release): $VERSION"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -q --force origin "HEAD:refs/heads/$branch"
          # Without --find-only this answers the open PR's number when there is
          # one, and opens a PR when there is not.
          number="$(node .github/release/release.mjs release-pr --version "$VERSION" --branch "$branch")"
          echo "release PR #$number"
          # Three distributions, then the packaging: longer than the default,
          # and under the 60 minutes the App token minted in this job lives --
          # a wait that outlived the token would fail on the merge call itself.
          # Assign, then echo: a failing substitution inside `echo` leaves
          # echo's own exit status, which is 0.
          commit="$(node .github/release/release.mjs merge-pr --number "$number" --timeout-minutes 45)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare, release-commit]
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release is uploaded with GITHUB_TOKEN; the tag and the
      # dispatch go out as the App.
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.release-commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-commit.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.FLEETLESS_APP_ID }}
          private-key: ${{ secrets.FLEETLESS_APP_PRIVATE_KEY }}
          owner: fleetless
          repositories: bridge,fleetless
          permission-contents: write
      - name: tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node .github/release/release.mjs create-tag --version "$VERSION" --sha "$COMMIT"
      - name: the tag, the version and main agree
        run: |
          set -euo pipefail
          git fetch -q --tags origin main
          ./ci/release-check.sh "v$VERSION"
      - name: package, and install every package in its own distribution
        run: ./ci/package.sh
      - name: the GitHub release, uploaded as this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/release/bridge-version.mjs notes > "$RUNNER_TEMP/notes.md"
          node .github/release/release.mjs github-release --version "$VERSION" --dir dist --notes-file "$RUNNER_TEMP/notes.md"
      - name: ask the ops repository to publish it to apt
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          node .github/release/release.mjs dispatch --component bridge --version "$VERSION" --commit "$COMMIT"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
      - name: summary
        if: always()
        env:
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
        run: |
          {
            echo "### bridge v$VERSION — ${{ job.status }}"
            echo
            echo "- release commit: \`$COMMIT\`"
            echo '```'
            cat dist/SHA256SUMS 2>/dev/null || echo "no SHA256SUMS: packaging did not finish"
            echo '```'
            if [ "$DISPATCHED" = true ]; then
              echo "- dispatched \`bridge-release\` to fleetless/fleetless: publish-apt.yml publishes, then installs from the served suite"
            else
              echo "- not dispatched: the run did not reach the ask-the-ops-repository step"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
